# Generic source configuration. Copy and adapt locally; do not commit local rules.
# Generate local runtime artifacts with:
#   python3 plan.py --config router.yaml --write "$HERMES_HOME/ai-gateway-router/plans.json"

defaults:
  time_value_cents_per_s: 0.15
  workload:
    input_tokens: 8000
    output_tokens: 1200
    cached_ratio: 0.5
  require_tools: true
  min_uptime_15m: 95
  max_candidates: 4
  session_affinity: true
  stats_ttl_s: 600
  precision:
    mode: auto
    require: fp8
    exclude: [fp4, int4]
  precision_policy:
    strict_min_pool: 3
    strict_max_unknown_share: 0.30
  quality:
    enabled: true
    fp4_penalty: 0.80
    unknown_precision_penalty: 0.97
    missing_structured_output: 0.97
    context_shrink: 0.98

models:
  provider/model-id:
    role: example-only
